services:
  odoo:
    build:
      context: ./odoo
      args:
        DB_VERSION: "18"
        ODOO_VERSION: "20.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GITHUB_TOKEN: "${DOODBA_GITHUB_TOKEN:-}"
    environment:
      EMAIL_FROM: ""
      PGDATABASE: &dbname doodba-db-main
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
      GITHUB_TOKEN: "${DOODBA_GITHUB_TOKEN:-}"
    tty: true
    volumes:
      - filestore:/var/lib/odoo
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "inverseproxy_shared"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"
  gatekeeper:
    image: ghcr.io/tecnativa/egress-gatekeeper:latest
    cap_add:
      - NET_ADMIN
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "inverseproxy_shared"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"
  db:
    image: ghcr.io/tecnativa/postgres-autoconf:18-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      PGDATA: "/var/lib/postgresql/data"
      CONF_EXTRA: |
        work_mem = 512MB
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 1s

  smtpfake:
    image: docker.io/mailhog/mailhog
